<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03141c">
<title>大鱼缸 · 生态版</title>
<style>
:root{
  --frame:#2b2118;--frame-hi:#4a3a26;--ink:#eef6f8;--muted:#9fb8bd;
  --gold:#e0b25a;--gold-line:rgba(224,178,90,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;width:100%;background:#0a0d10;overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  display:flex;align-items:center;justify-content:center;
  height:100vh;height:100dvh;max-height:100dvh;
  padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right))
          max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));
}
#app{
  display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;
}
#stage{
  position:relative;flex:0 0 auto;min-height:0;min-width:0;
  border-radius:22px;padding:3px;
  background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 30%,rgba(0,0,0,.3));
  box-shadow:
    0 36px 70px -14px rgba(0,0,0,.7),
    0 12px 28px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.06),
    inset 0 1px 0 rgba(255,255,255,.18),
    inset 0 -3px 8px rgba(0,0,0,.35);
  overflow:hidden;
}
#tankWrap{
  position:relative;width:100%;height:100%;border-radius:19px;overflow:hidden;
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.12),
    inset 0 10px 30px rgba(0,0,0,.5),
    inset 0 -6px 16px rgba(0,0,0,.35);
  touch-action:none;
}
#tankWrap::before{
  content:"";position:absolute;inset:0;z-index:5;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.06) 14%,transparent 30%,transparent 78%,rgba(255,255,255,.05) 100%);
  mix-blend-mode:screen;
}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{
  position:absolute;top:6px;left:0;right:0;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:0 6px;pointer-events:none;
}
#titleWrap{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:rgba(0,0,0,.3);padding:3px 10px;border-radius:10px;
  text-align:center;
}
#title{color:var(--gold);font-weight:800;font-size:11px;letter-spacing:.35px;
  text-shadow:0 1px 3px rgba(0,0,0,.6);line-height:1.2}
#credit{color:var(--gold);font-size:8px;font-weight:600;opacity:.85;
  letter-spacing:.12em;line-height:1.2;text-align:center}
#btnAddFish{
  border:1px solid rgba(255,200,100,.45);border-radius:10px;
  padding:4px 8px;font-size:10px;font-weight:800;cursor:pointer;
  background:linear-gradient(160deg,var(--gold),#a9782f);color:#231705;
}
#btnAddFish:active{transform:scale(.94)}
#popStatHud{
  font-size:10px;font-weight:700;color:var(--ink);
  background:rgba(0,0,0,.35);padding:4px 8px;border-radius:8px;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
  line-height:1.35;word-break:break-word;
  max-width:100%;min-height:1.35em;overflow:hidden;
}
#wqAlert{
  position:absolute;left:50%;top:12%;transform:translateX(-50%);
  pointer-events:none;z-index:5;font-size:11px;font-weight:800;color:#fff;
  background:rgba(180,40,30,.88);padding:5px 12px;border-radius:10px;
  opacity:0;transition:opacity .35s;white-space:nowrap;
}
#wqAlert.show{opacity:1}
#gestureToast{
  position:absolute;left:50%;bottom:8%;transform:translateX(-50%);
  pointer-events:none;z-index:6;font-size:12px;font-weight:800;color:#fff;
  background:rgba(20,80,60,.85);padding:6px 14px;border-radius:12px;
  opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;
}
#gestureToast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
#sideDisplay,#sideControls{
  width:100%;border-radius:12px;padding:8px 10px;
}
#sideControls{
  border:1px solid var(--gold-line);
  background:linear-gradient(165deg,#1c1610,#120e0a);
  box-shadow:0 4px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.04);
}
#sideDisplay{
  border:1px solid transparent;background:transparent;box-shadow:none;
}
#sideDisplay{display:flex;flex-direction:column;gap:6px}
#sideControls{display:flex;flex-direction:column;gap:7px}
.ctrl-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px}
button,.ctrl-stat{
  border:1px solid rgba(255,255,255,.12);border-radius:10px;
  padding:5px 8px;font-size:10px;font-weight:700;cursor:pointer;
  background:linear-gradient(160deg,#2c2115,#1c150d);color:var(--ink);
  box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .12s,color .15s,border-color .15s;
  display:inline-flex;align-items:center;justify-content:center;gap:4px;line-height:1.2;
  white-space:nowrap;flex:0 0 auto;min-width:4.5em;
}
button:active{transform:scale(.94)}
button.gold{background:linear-gradient(160deg,var(--gold),#a9782f);color:#231705;border-color:var(--gold)}
#btnFilter{min-width:5.5em}
.ctrl-stat{cursor:default;user-select:none;min-width:0}
#wqMonitor{font-size:9px;font-weight:700;color:var(--ink);line-height:1.3;padding:2px;
  text-shadow:0 1px 2px rgba(0,0,0,.5);min-height:1.3em;
  white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#wqMonitor::-webkit-scrollbar{display:none}
#wqMonitor.warn{color:#e8c45a}
#wqMonitor.danger{color:#ff8a7a;animation:pulseDanger 1.2s ease-in-out infinite}
@keyframes pulseDanger{0%,100%{opacity:1}50%{opacity:.75}}
.bar{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);
  overflow:hidden;display:inline-block;vertical-align:middle}
.bar>i{display:block;height:100%;border-radius:3px;transition:width .3s,background .3s}
/* professional aquarium console */
#sideDisplay,#sideControls{background:linear-gradient(180deg,rgba(20,35,42,.96),rgba(8,20,27,.96));border:1px solid rgba(111,190,205,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.22)}
.console-head{display:flex;justify-content:space-between;align-items:center;color:#a9dbe5;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.console-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.metric{background:rgba(0,0,0,.22);border:1px solid rgba(126,190,205,.15);border-radius:7px;padding:6px 8px;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px}
.metric b{display:block;color:#e8f8fb;font-size:15px;line-height:1.2;white-space:nowrap}.metric span{display:block;color:#87aab3;font-size:10px;margin-top:0;text-align:right;white-space:nowrap}
.console-led{display:inline-block;width:6px;height:6px;border-radius:50%;background:#45e58a;box-shadow:0 0 8px #45e58a;margin-right:4px}
#sideControls .ctrl-row{gap:7px}#sideControls button{border-color:rgba(120,190,205,.3);background:linear-gradient(180deg,#1b3c46,#10252d);color:#d9f4f7;font-weight:800}

/* —— 悬浮统一控制/显示菜单（三击鱼缸唤出，半透明） —— */
#menuOverlay{
  position:fixed;inset:0;z-index:50;
  display:none;align-items:center;justify-content:center;
  padding:16px;
}
#menuOverlay.show{display:flex}
#menuPanel{
  position:relative;width:min(94vw,640px);max-height:92vh;max-height:92dvh;
  overflow:auto;-webkit-overflow-scrolling:touch;
  background:rgba(14,28,36,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(111,190,205,.45);border-radius:18px;
  padding:14px 14px 18px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 24px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06);
}
#menuPanel #sideDisplay,#menuPanel #sideControls{
  background:rgba(10,22,28,.35);
}
#btnCloseMenu{
  min-width:0;width:22px;height:22px;padding:0;border-radius:50%;
  font-size:12px;line-height:1;background:rgba(255,255,255,.15);border:none;color:#e8f8fb;
}
@media (orientation:landscape) and (min-width:640px){
  #menuPanel{display:grid;grid-template-columns:1fr 1fr;align-items:start;}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="tankWrap">
      <canvas id="tank"></canvas>
      <div id="hud">
        <div id="titleWrap">
          <span id="credit">TP制作🐠</span>
        </div>
      </div>
      <div id="wqAlert"></div>
      <div id="gestureToast"></div>
    </div>
  </div>
</div>

<div id="menuOverlay">
  <div id="menuPanel">
    <div id="sideDisplay">
      <div class="console-head">
        <span>◈ AQUA CONTROL</span>
        <span>
          <i class="console-led"></i>ONLINE
          <button type="button" id="btnCloseMenu" title="关闭" style="margin-left:6px;">✕</button>
        </span>
      </div>
      <div id="popStatHud">🐟 3</div>
      <div id="wqMonitor">水质监测 · 优秀</div>
      <div class="console-grid">
        <div class="metric"><b id="tempRead">24.0°C</b><span>TEMP</span></div>
        <div class="metric"><b id="phRead">7.2</b><span>pH</span></div>
        <div class="metric"><b id="nutRead">25%</b><span>NUTRIENTS</span></div>
        <div class="metric"><b id="oxRead">85%</b><span>OXYGEN</span></div>
      </div>
      <div class="ctrl-row">
        <button type="button" id="btnAddFish" title="添加大金鱼">🐟+</button>
        <span class="ctrl-stat">水质 <span class="bar"><i id="wqBar"></i></span></span>
        <button type="button" id="btnFeed" class="gold" title="投食">🍤 投食</button>
        <span class="ctrl-stat">氧气 <span class="bar"><i id="oxBar"></i></span></span>
      </div>
    </div>
    <div id="sideControls">
      <div class="ctrl-row">
        <button id="btnFilter">🌀 过滤</button>
        <button id="btnWater">💧 换水</button>
        <button id="btnCycle">🌗 昼/夜</button>
        <button id="btnTrim">🌿 修剪</button>
      </div>
      <div class="ctrl-row" style="font-size:9px;opacity:.75;font-weight:600;justify-content:center;text-align:center;line-height:1.5;">
        <span>手势提示：长按 = 菜单 &nbsp;·&nbsp; 点击 = 投食(可连点多投) &nbsp;·&nbsp; 画圈 = 换水 &nbsp;·&nbsp; 画✅ = 开/关过滤 &nbsp;·&nbsp; ←划→ = 修剪 &nbsp;·&nbsp; →划← = 定格画面 &nbsp;·&nbsp; ↓划↑ = 昼/夜 &nbsp;·&nbsp; ↑划↓ = 加鱼</span>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
const canvas = document.getElementById("tank");
const ctx = canvas.getContext("2d", { alpha: false });
let W = 0, H = 0, DPR = 1;
const staticCanvas = document.createElement("canvas");
const staticCtx = staticCanvas.getContext("2d");
let staticDirty = true;

let _resizeT = 0;
function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  const nw = Math.max(1, Math.floor(rect.width));
  const nh = Math.max(1, Math.floor(rect.height));
  const ndpr = Math.min(window.devicePixelRatio || 1, 2);
  if (nw === W && nh === H && ndpr === DPR) return;
  DPR = ndpr; W = nw; H = nh;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  staticCanvas.width = W * DPR; staticCanvas.height = H * DPR;
  staticCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  staticDirty = true;
}
function scheduleResize() {
  clearTimeout(_resizeT);
  _resizeT = setTimeout(resize, 50);
}
window.addEventListener("resize", scheduleResize);
window.addEventListener("orientationchange", scheduleResize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let isNight = false, t = 0;
const surfaceY = () => H * 0.10;
const floorY = () => H * 0.87;

/* —— ecosystem —— */
let waterQuality = 0.92, nutrients = 0.25, oxygen = 0.85, filterOn = false;
const MAX_FISH = 12, MAX_EGGS = 8, MAX_BUBBLES = 40;
const wqHistory = [];
let wqLastGrade = "excellent", wqAlertTimer = 0, wqSampleAcc = 0;

function plantCoverAt(x, y) {
  let best = 0;
  const fy = floorY();
  for (const p of plants) {
    const px = W * p.xFrac, py = fy - H * p.h * 0.45;
    const rad = 22 + p.h * H * 0.22;
    const d = Math.hypot(x - px, y - py);
    if (d < rad) best = Math.max(best, (1 - d / rad) * p.health * Math.min(1, p.h / p.baseH));
  }
  return best;
}

function wqGrade(q) {
  if (q >= 0.75) return { id: "excellent", label: "优秀", cls: "" };
  if (q >= 0.55) return { id: "good", label: "良好", cls: "" };
  if (q >= 0.35) return { id: "fair", label: "一般", cls: "warn" };
  if (q >= 0.18) return { id: "poor", label: "较差", cls: "warn" };
  return { id: "critical", label: "危险", cls: "danger" };
}
function wqTrend() {
  if (wqHistory.length < 4) return "→";
  const d = wqHistory[wqHistory.length - 1] - wqHistory[Math.max(0, wqHistory.length - 6)];
  return d > 0.03 ? "↑" : d < -0.03 ? "↓" : "→";
}
function wqAdvice() {
  const tips = [];
  if (waterQuality < 0.55 && !filterOn) tips.push("开过滤");
  if (waterQuality < 0.45) tips.push("换水");
  if (nutrients > 0.7) tips.push("残饵多");
  if (oxygen < 0.35) tips.push("缺氧");
  if (fishes.filter(f => f.alive).length > 7) tips.push("过密");
  if (foods.filter(f => !f.eaten && f.age > 6).length > 2) tips.push("清残饵");
  return tips.slice(0, 2).join(" · ") || "稳定";
}
function pushWqSample() {
  wqHistory.push(waterQuality);
  if (wqHistory.length > 24) wqHistory.shift();
  const g = wqGrade(waterQuality);
  if (g.id !== wqLastGrade) {
    if (g.id === "critical") showWqAlert("⚠ 水质危险！请换水或开过滤");
    else if (g.id === "poor") showWqAlert("水质下降，注意监测");
    else if (wqLastGrade === "critical" || wqLastGrade === "poor") showWqAlert("水质开始回升");
    wqLastGrade = g.id;
  }
}
function showWqAlert(msg) {
  const el = document.getElementById("wqAlert");
  el.textContent = msg;
  el.classList.add("show");
  wqAlertTimer = 3.2;
}

function lerpColor(a, b, u) {
  u = clamp(u, 0, 1);
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const r = (((pa >> 16) & 255) * (1 - u) + ((pb >> 16) & 255) * u) | 0;
  const g = (((pa >> 8) & 255) * (1 - u) + ((pb >> 8) & 255) * u) | 0;
  const bl = ((pa & 255) * (1 - u) + (pb & 255) * u) | 0;
  return `rgb(${r},${g},${bl})`;
}

/* —— water —— */
function drawWater() {
  const sy = surfaceY(), fy = floorY(), murk = 1 - waterQuality;
  const day = ctx.createLinearGradient(0, sy, 0, fy);
  if (isNight) {
    day.addColorStop(0, lerpColor("#0c2b3a", "#1a2a18", murk));
    day.addColorStop(0.5, lerpColor("#082230", "#152218", murk));
    day.addColorStop(1, lerpColor("#04141d", "#0c1810", murk));
  } else {
    day.addColorStop(0, lerpColor("#bdeaf5", "#c5d4a8", murk * 0.7));
    day.addColorStop(0.35, lerpColor("#5fc2d9", "#6a9a70", murk));
    day.addColorStop(0.75, lerpColor("#1f7f9e", "#3d5c40", murk));
    day.addColorStop(1, lerpColor("#0e4f66", "#243820", murk));
  }
  ctx.fillStyle = day;
  ctx.fillRect(0, sy, W, fy - sy);
  ctx.fillStyle = isNight ? "#020409" : "#dff3f7";
  ctx.fillRect(0, 0, W, sy);

  ctx.save();
  ctx.beginPath(); ctx.rect(0, sy, W, fy - sy); ctx.clip();
  ctx.fillStyle = isNight ? "rgba(255,255,255,0.03)" : "rgba(255,255,255,0.09)";
  for (let i = 0; i < 5; i++) {
    const bx = (i / 5) * W + Math.sin(t * 0.15 + i) * 18;
    ctx.beginPath();
    ctx.moveTo(bx - 18, sy); ctx.lineTo(bx + 18, sy);
    ctx.lineTo(bx + 55, fy); ctx.lineTo(bx + 8, fy);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  ctx.strokeStyle = isNight ? "rgba(180,220,255,.25)" : "rgba(255,255,255,.55)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 8) {
    const y = sy + Math.sin(x * 0.08 + t * 2) * 1.6;
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  if (isNight) {
    ctx.fillStyle = "rgba(220,235,255,.9)";
    ctx.beginPath(); ctx.arc(W * 0.82, sy * 0.4, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.8)";
    for (let i = 0; i < 12; i++) {
      const sx = (i * 53.7) % W;
      ctx.globalAlpha = 0.3 + ((Math.sin(i * 12.9 + 1) + 1) / 2) * 0.5;
      ctx.fillRect(sx, (i * 13) % (sy * 0.9), 1.5, 1.5);
    }
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = "rgba(255,214,120,.9)";
    ctx.beginPath(); ctx.arc(W * 0.85, sy * 0.4, 10, 0, Math.PI * 2); ctx.fill();
  }
}

/* —— static floor —— */
const gravelSeed = Array.from({ length: 220 }, () => ({ x: Math.random(), c: Math.random() }));
function rebuildStaticLayer() {
  const c = staticCtx;
  c.clearRect(0, 0, W, H);
  const fy = floorY();
  c.fillStyle = isNight ? "#1b140d" : "#7a5a36";
  c.fillRect(0, fy, W, H - fy);
  for (const g of gravelSeed) {
    const gx = g.x * W, gy = fy + 4 + g.c * (H - fy - 8);
    const shade = 0.5 + Math.sin(g.c * 40) * 0.2;
    c.fillStyle = isNight
      ? `rgba(${60 + shade * 40},${45 + shade * 30},${30 + shade * 20},.9)`
      : `rgba(${150 + shade * 80},${110 + shade * 60},${60 + shade * 40},.9)`;
    c.beginPath();
    c.ellipse(gx, gy, 2 + shade * 2, 1.4 + shade, 0, 0, Math.PI * 2);
    c.fill();
  }
  function rock(x, y, s) {
    c.fillStyle = isNight ? "#2c2c30" : "#6b6b6f";
    c.beginPath(); c.ellipse(x, y, s, s * 0.6, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = isNight ? "#3a3a40" : "#87878c";
    c.beginPath(); c.ellipse(x - s * 0.2, y - s * 0.3, s * 0.5, s * 0.3, 0, 0, Math.PI * 2); c.fill();
  }
  rock(W * 0.16, fy + 6, 17);
  rock(W * 0.21, fy + 11, 10);
  rock(W * 0.5, fy + 5, 11);
  rock(W * 0.62, fy + 9, 7);
  rock(W * 0.94, fy + 7, 13);
  rock(W * 0.90, fy + 12, 8);
  const px = W * 0.84, py = surfaceY() - 2;
  c.fillStyle = "#4a3018";
  c.beginPath(); c.ellipse(px, py, 34, 8, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#5c3d20";
  c.beginPath(); c.ellipse(px - 6, py - 3, 22, 5, 0, 0, Math.PI * 2); c.fill();
  staticDirty = false;
}

/* —— plants —— */
const plants = [
  { xFrac: 0.06, baseH: 0.22, h: 0.22, sway: 0.6, health: 1, type: "grass", hue: 122, density: 7 },
  { xFrac: 0.30, baseH: 0.26, h: 0.26, sway: 1.9, health: 1, type: "broadleaf", hue: 92, density: 5 },
  { xFrac: 0.55, baseH: 0.18, h: 0.18, sway: 3.1, health: 1, type: "redPlant", hue: 8, density: 6 },
  { xFrac: 0.76, baseH: 0.32, h: 0.32, sway: 0, health: 1, type: "grass", hue: 145, density: 9 },
  { xFrac: 0.96, baseH: 0.22, h: 0.22, sway: 1.4, health: 1, type: "moss", hue: 62, density: 4 }
];
function updatePlants(dt) {
  const light = isNight ? 0.025 : 0.09;
  const grow = light * (0.35 + nutrients * 1.1) * (0.5 + oxygen * 0.8) * (filterOn ? 1.15 : 1) * dt;
  for (const p of plants) {
    const maxH = p.baseH * (1.1 + nutrients * 0.55 + oxygen * 0.2);
    if (p.health > 0.2) {
      p.h = Math.min(maxH, p.h + grow * p.health);
      waterQuality = Math.min(1, waterQuality + p.h * 0.005 * dt);
      nutrients = Math.max(0, nutrients - p.h * 0.01 * dt);
      oxygen = Math.min(1, oxygen + p.h * p.health * (isNight ? 0.008 : 0.045) * dt);
    }
    if (waterQuality < 0.35 || oxygen < 0.25)
      p.health = Math.max(0.12, p.health - 0.025 * dt);
    else
      p.health = Math.min(1, p.health + 0.012 * dt);
  }
}
function drawPlants() {
  const fy = floorY();
  for (const p of plants) {
    const x = W * p.xFrac, h = H * p.h;
    const baseHue = isNight ? p.hue - 12 : p.hue;
    const sat = p.health > .5 ? 62 : 35;
    const light = isNight ? 22 : (p.health > .5 ? 42 : 30);
    const hue = `hsl(${baseHue},${sat}%,${light}%)`;
    ctx.strokeStyle = hue; ctx.fillStyle = hue; ctx.lineCap = "round";
    if (p.type === "broadleaf") {
      for(let b=0;b<p.density;b++){ const off=(b-(p.density-1)/2)*5; const sway=Math.sin(t*.9+b+p.sway)*10;
        ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(x+off,fy+4); ctx.quadraticCurveTo(x+off+sway,fy-h*.55,x+off+sway*.7,fy-h); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(x+off+sway*.7,fy-h*(.62+.04*(b%3)),7,15,-.35+Math.sin(b)*.15,0,Math.PI*2); ctx.fill(); }
    } else if (p.type === "redPlant") {
      for(let b=0;b<p.density;b++){ const off=(b-(p.density-1)/2)*4; const sway=Math.sin(t*1.3+b+p.sway)*12;
        ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x+off,fy+4); ctx.bezierCurveTo(x+off+sway,fy-h*.35,x+off-sway,fy-h*.7,x+off+sway*.6,fy-h); ctx.stroke();
        ctx.fillStyle=`hsla(${baseHue+Math.sin(b)*8},${sat}%,${light+8}%,.8)`; ctx.beginPath(); ctx.ellipse(x+off+sway*.6,fy-h*.78,4,9,.4,0,Math.PI*2); ctx.fill(); ctx.fillStyle=hue; }
    } else if (p.type === "moss") {
      ctx.lineWidth=3; for(let b=0;b<9;b++){ const off=(b-4)*3.5; const hh=h*(.35+((b*7)%5)/10); ctx.beginPath(); ctx.moveTo(x+off,fy+3); ctx.quadraticCurveTo(x+off-5,fy-hh*.5,x+off+Math.sin(t+b)*4,fy-hh); ctx.stroke(); }
    } else {
      for(let b=0;b<p.density;b++){ const off=(b-(p.density-1)/2)*4.5; ctx.lineWidth=2.8; ctx.beginPath(); ctx.moveTo(x+off,fy+4); ctx.quadraticCurveTo(x+off+Math.sin(t*1.1+b+p.sway)*10,fy-h*.55,x+off+Math.sin(t*1.1+b+p.sway+1)*16,fy-h); ctx.stroke(); }
    }
  }
}
function trimPlants() {
  for (const p of plants) {
    if (p.h > p.baseH * 0.7) {
      p.h *= 0.65;
      nutrients = Math.min(1, nutrients + 0.05);
    }
  }
  playBlip(400);
}

/* —— bubbles —— */
let bubbles = [];
function spawnBubble(x, y) {
  if (bubbles.length >= MAX_BUBBLES) return;
  bubbles.push({ x: x + rand(-4, 4), y, r: rand(1.5, 3.5), vy: rand(28, 46), drift: rand(-6, 6) });
}
function updateBubbles(dt) {
  if (Math.random() < 0.28) spawnBubble(W * 0.5, floorY() - 2);
  if (filterOn && Math.random() < 0.45) spawnBubble(W * 0.12, floorY() - 4);
  const sy = surfaceY();
  let w = 0;
  for (let i = 0; i < bubbles.length; i++) {
    const b = bubbles[i];
    b.y -= b.vy * dt;
    b.x += Math.sin(b.y * 0.05) * b.drift * dt;
    if (b.y > sy) bubbles[w++] = b;
  }
  bubbles.length = w;
}
function drawBubbles() {
  ctx.fillStyle = isNight ? "rgba(200,230,255,.35)" : "rgba(255,255,255,.55)";
  for (const b of bubbles) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
  }
}

/* —— food —— */
let foods = [];
function dropFood(x, y) {
  foods.push({ x, y: Math.max(y, surfaceY() + 6), vy: 10, eaten: false, r: 3.5, age: 0, corpse: false });
}
function updateFood(dt) {
  const fy = floorY();
  let w = 0;
  for (let i = 0; i < foods.length; i++) {
    const f = foods[i];
    if (f.eaten) continue;
    if (f.y < fy - 6) f.y += f.vy * dt;
    else {
      f.age += dt;
      if (f.age > 12) {
        waterQuality = Math.max(0, waterQuality - 0.04);
        nutrients = Math.min(1, nutrients + 0.06);
        continue;
      }
    }
    foods[w++] = f;
  }
  foods.length = w;
}
function drawFood() {
  for (const f of foods) {
    ctx.fillStyle = f.corpse ? "#8a6a4a" : (f.age > 6 ? "#8a6a3a" : "#c98a3b");
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
  }
}

/* —— eggs / genetics —— */
const PALETTES = [
  { light: "#ffb84d", dark: "#ff7a2e" },
  { light: "#ffcf6b", dark: "#ff9a3d", patch: "rgba(255,255,255,.55)" },
  { light: "#ff9d6b", dark: "#e85a2e" },
  { light: "#ff6b9d", dark: "#e02060", patch: "rgba(255,255,255,.4)" },
  { light: "#7ec8ff", dark: "#2a6fc0" },
  { light: "#ffe566", dark: "#e0a020", patch: "rgba(40,30,20,.35)" },
  { light: "#ff8c42", dark: "#c04010", patch: "rgba(255,220,100,.45)" },
  { light: "#e0b0ff", dark: "#8a40c0" }
];
let eggs = [];

function mixHex(h1, h2, bias) {
  const p = parseInt(h1.slice(1), 16), q = parseInt(h2.slice(1), 16);
  const u = bias != null ? bias : rand(0.35, 0.65);
  const r = ((p >> 16) & 255) * (1 - u) + ((q >> 16) & 255) * u;
  const g = ((p >> 8) & 255) * (1 - u) + ((q >> 8) & 255) * u;
  const bl = (p & 255) * (1 - u) + (q & 255) * u;
  return `#${((r | 0) << 16 | (g | 0) << 8 | (bl | 0)).toString(16).padStart(6, "0")}`;
}
function mixHue(a, b) {
  const hue = { light: mixHex(a.light, b.light), dark: mixHex(a.dark, b.dark) };
  if (a.patch || b.patch || Math.random() < 0.35) {
    const patches = ["rgba(255,255,255,.55)", "rgba(40,30,20,.4)", "rgba(220,60,40,.35)", "rgba(255,200,80,.4)"];
    hue.patch = patches[Math.floor(Math.random() * patches.length)];
  }
  if (Math.random() < 0.12) {
    const m = PALETTES[3 + Math.floor(Math.random() * 5)];
    hue.light = mixHex(hue.light, m.light, 0.55);
    hue.dark = mixHex(hue.dark, m.dark, 0.55);
  }
  return hue;
}
function layEgg(x, y, hueA, hueB) {
  if (eggs.length >= MAX_EGGS) return;
  eggs.push({
    x: x + rand(-8, 8),
    y: clamp(y + rand(-4, 4), surfaceY() + 20, floorY() - 20),
    age: 0, hatchIn: rand(9, 14), alive: true,
    hueA: hueA || PALETTES[0], hueB: hueB || PALETTES[1]
  });
}
function updateEggs(dt) {
  let w = 0;
  for (let i = 0; i < eggs.length; i++) {
    const e = eggs[i];
    if (!e.alive) continue;
    e.age += dt;
    if (waterQuality < 0.25 && Math.random() < 0.15 * dt) {
      nutrients = Math.min(1, nutrients + 0.02);
      continue;
    }
    if (e.age >= e.hatchIn) {
      if (fishes.length < MAX_FISH && waterQuality > 0.3) {
        const baby = new Goldfish(mixHue(e.hueA, e.hueB), "baby");
        baby.x = e.x; baby.y = e.y;
        fishes.push(baby);
      }
      continue;
    }
    eggs[w++] = e;
  }
  eggs.length = w;
}
function drawEggs() {
  for (const e of eggs) {
    const pulse = 0.7 + Math.sin(t * 4 + e.x) * 0.15;
    ctx.fillStyle = `rgba(255,230,180,${pulse})`;
    ctx.beginPath(); ctx.ellipse(e.x, e.y, 3.5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(200,160,80,0.5)"; ctx.lineWidth = 1; ctx.stroke();
  }
}

/* —— goldfish —— */
/* —— fin-ray rendering helper (fancy goldfish fins made of many thin rays) —— */
function _bezierPt(p0, p1, p2, tt) {
  const mt = 1 - tt;
  return { x: mt * mt * p0.x + 2 * mt * tt * p1.x + tt * tt * p2.x, y: mt * mt * p0.y + 2 * mt * tt * p1.y + tt * tt * p2.y };
}
function drawFinRays(p0, p1, p2, count, color, alpha, lw) {
  ctx.strokeStyle = color;
  ctx.globalAlpha = alpha;
  ctx.lineWidth = lw;
  ctx.lineCap = "round";
  for (let i = 1; i <= count; i++) {
    const tt = 0.22 + (i / count) * 0.72;
    const pt = _bezierPt(p0, p1, p2, tt);
    const ctrl = _bezierPt(p0, p1, p2, tt * 0.55);
    ctx.beginPath();
    ctx.moveTo(p0.x, p0.y);
    ctx.quadraticCurveTo(ctrl.x, ctrl.y, pt.x, pt.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

class Goldfish {
  constructor(hue, stage = "adult") {
    this.x = rand(W * 0.2, W * 0.8);
    this.y = rand(H * 0.25, H * 0.7);
    this.dir = rand(0, Math.PI * 2);
    this.personality = { speedBias: rand(.72,1.38), turnRate: rand(.75,1.35), depth: rand(.18,.82), route: ["cruise","zigzag","bottom","surface"][Math.floor(Math.random()*4)] };
    this.speed = (stage === "baby" ? rand(18, 26) : rand(24, 34)) * this.personality.speedBias;
    this.wiggle = rand(0, 10);
    this.hue = hue;
    this.size = stage === "baby" ? rand(0.35, 0.5) : rand(0.85, 1.15);
    this.retarget = 0;
    this.tx = this.x; this.ty = this.y;
    this.fleeing = false; this.hiding = false; this.hideTime = 0;
    this.stage = stage;
    this.age = stage === "baby" ? 0 : rand(20, 60);
    this.hunger = stage === "baby" ? 0.4 : rand(0.3, 0.6);
    this.breedCD = rand(8, 18);
    this.mealsEaten = 0; this.armor = 0;
    this.alive = true;
  }
  pickTarget() {
    const margin = 40;
    if (this.stage === "adult" && this.armor >= 0.4) {
      const fry = fishes.find(f => f.alive && f.stage === "baby");
      if (fry) {
        this.tx = clamp(fry.x + rand(-25, 25), margin, W - margin);
        this.ty = clamp(fry.y + rand(-20, 20), surfaceY() + 20, floorY() - 14);
        this.retarget = rand(1.5, 3);
        return;
      }
    }
    if (this.hunger > 0.55 && this.stage === "baby") {
      const p = plants[Math.floor(Math.random() * plants.length)];
      this.tx = clamp(W * p.xFrac + rand(-20, 20), margin, W - margin);
      this.ty = clamp(floorY() - H * p.h * 0.4 + rand(-15, 15), surfaceY() + 20, floorY() - 14);
    } else {
      this.tx = rand(margin, W - margin);
      const route = this.personality.route;
      if (route === "bottom") this.ty = rand(floorY() - 70, floorY() - 14);
      else if (route === "surface") this.ty = rand(surfaceY() + 24, surfaceY() + H * .22);
      else if (route === "zigzag") this.ty = clamp(H * this.personality.depth + Math.sin(t*2.4+this.wiggle)*H*.18, surfaceY()+24, floorY()-14);
      else this.ty = rand(surfaceY() + 24, floorY() - 14);
    }
    this.retarget = rand(2.5, 5);
  }
  fleeFromTurtle() {
    if (!turtle || !this.alive || turtle.peaceful) return false;
    const d = Math.hypot(turtle.x - this.x, turtle.y - this.y);
    const scareR = turtle.chasingFood || turtle.eatTimer > 0
      ? (this.stage === "baby" ? 110 : 90)
      : (this.stage === "baby" ? 75 : 55);
    if (d > scareR) return false;
    let bestP = plants[0], bestScore = -1;
    for (const p of plants) {
      if (p.h * p.health > bestScore) { bestScore = p.h * p.health; bestP = p; }
    }
    this.tx = clamp(W * bestP.xFrac + rand(-12, 12), 30, W - 30);
    this.ty = clamp(floorY() - H * bestP.h * 0.5 + rand(-8, 8), surfaceY() + 18, floorY() - 12);
    this.fleeing = true;
    this.retarget = 0.9;
    return true;
  }
  tryBreed() {
    if (this.stage !== "adult" || this.breedCD > 0) return;
    if (this.hunger < 0.35 || this.hunger > 0.85) return;
    if (waterQuality < 0.45 || oxygen < 0.4) return;
    if (fishes.filter(f => f.alive && f.stage === "adult").length < 2) return;
    if (eggs.length >= MAX_EGGS) return;
    let partner = null;
    for (const o of fishes) {
      if (o === this || !o.alive || o.stage !== "adult") continue;
      if (o.breedCD > 0 || o.hunger < 0.35) continue;
      if (Math.hypot(o.x - this.x, o.y - this.y) < 50) { partner = o; break; }
    }
    if (!partner) return;
    const p = plants[Math.floor(Math.random() * plants.length)];
    const lx = W * p.xFrac + rand(-15, 15);
    const ly = floorY() - H * p.h * 0.35;
    const peace = turtle && turtle.peaceful;
    const n = peace ? (2 + (Math.random() < 0.5 ? 1 : 0)) : (1 + (Math.random() < 0.4 ? 1 : 0));
    for (let i = 0; i < n; i++) layEgg(lx, ly, this.hue, partner.hue);
    this.breedCD = peace ? rand(6, 12) : rand(20, 35);
    partner.breedCD = peace ? rand(6, 12) : rand(20, 35);
    playBlip(520);
  }
  stressLevel() {
    let s = 0;
    if (this.hunger < 0.35) s += (0.35 - this.hunger) * 1.4;
    if (this.hunger < 0.15) s += 0.25;
    if (waterQuality < 0.45) s += (0.45 - waterQuality) * 0.9;
    if (oxygen < 0.4) s += (0.4 - oxygen) * 1.1;
    if (this.hideTime > 6) s += Math.min(0.35, (this.hideTime - 6) * 0.03);
    if (this.fleeing) s += 0.35;
    return clamp(s, 0, 1);
  }
  update(dt) {
    if (!this.alive) return;
    this.age += dt;
    this.breedCD -= dt;
    const cover = plantCoverAt(this.x, this.y);
    this.hiding = cover > 0.35;
    this.hideTime = this.hiding ? this.hideTime + dt : Math.max(0, this.hideTime - dt * 0.5);

    const isAdult = this.stage === "adult";
    let drain = isAdult ? 0.010 : 0.032;
    if (this.hideTime > 8) drain *= isAdult ? 1.15 : 1.4;
    if (this.hideTime > 16) drain *= isAdult ? 1.1 : 1.4;
    if (oxygen < 0.3) drain *= isAdult ? 1.1 : 1.3;
    this.hunger = Math.max(0, this.hunger - dt * drain);
    oxygen = Math.max(0, oxygen - (isAdult ? 0.0045 : 0.004) * dt);

    if (!isAdult && this.age > (oxygen > 0.55 ? 16 : 20)) {
      this.stage = "adult";
      this.size = rand(0.85, 1.1);
      this.speed = rand(24, 34);
    }
    if (this.armor > 0 && this.hunger < 0.35) this.armor = Math.max(0, this.armor - 0.015 * dt);

    if (this.hunger <= 0 && Math.random() < (isAdult ? 0.025 : 0.1) * dt) { this.die(); return; }
    if (waterQuality < (isAdult ? 0.06 : 0.12) && Math.random() < (isAdult ? 0.03 : 0.12) * dt) { this.die(); return; }
    if (oxygen < (isAdult ? 0.04 : 0.08) && Math.random() < (isAdult ? 0.04 : 0.15) * dt) { this.die(); return; }
    if (waterQuality < 0.28) this.hunger = Math.max(0, this.hunger - (isAdult ? 0.004 : 0.01) * dt);

    this.retarget -= dt;
    this.fleeing = false;
    if (this.fleeFromTurtle()) {
      /* fear blocks foraging */
    } else if (this.hunger < 0.85) {
      let target = null, best = Infinity;
      for (const f of foods) {
        if (f.eaten) continue;
        if (turtle && Math.hypot(f.x - turtle.x, f.y - turtle.y) < 70) continue;
        const d = Math.hypot(f.x - this.x, f.y - this.y);
        if (d < best) { best = d; target = f; }
      }
      if (target) {
        this.tx = target.x; this.ty = target.y;
        if (best < (isAdult ? 8 : 6)) {
          target.eaten = true;
          this.hunger = Math.min(1, this.hunger + 0.35);
          this.hideTime = 0;
          if (isAdult) {
            this.mealsEaten++;
            this.armor = Math.min(1, this.armor + 0.18);
          }
        }
      } else if (this.retarget <= 0) this.pickTarget();
    } else if (this.retarget <= 0) this.pickTarget();

    this.tryBreed();

    const dx = this.tx - this.x, dy = this.ty - this.y;
    const dist = Math.hypot(dx, dy) || 1;
    let diff = Math.atan2(dy, dx) - this.dir;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    this.dir += diff * Math.min(1, dt * (this.fleeing ? 4.8 : 2.2) * this.personality.turnRate);
    let speed = this.speed;
    if (this.fleeing) speed *= 1.9;
    else if (this.hunger < 0.25) speed *= 0.65;
    else if (this.hunger < 0.85 && foods.some(f => !f.eaten)) speed *= 1.15;
    if (waterQuality < 0.3) speed *= 0.75;
    if (oxygen < 0.25) speed *= 0.7;
    if (this.hiding && !this.fleeing) speed *= 0.75;
    const step = Math.min(speed * dt, dist);
    this.x = clamp(this.x + Math.cos(this.dir) * step, 20, W - 20);
    this.y = clamp(this.y + Math.sin(this.dir) * step, surfaceY() + 16, floorY() - 10);
    const animRate = this.fleeing ? 14 : (this.hunger < 0.85 && foods.some(f => !f.eaten) ? 10 : 6.5);
    this.wiggle += dt * (animRate + speed * 0.12);
    if (this.hunger > 0.5) {
      waterQuality = Math.max(0, waterQuality - 0.0015 * dt);
      nutrients = Math.min(1, nutrients + 0.002 * dt);
    }
  }
  die() {
    this.alive = false;
    const impact = this.stage === "adult" ? 0.035 : 0.05;
    waterQuality = Math.max(0, waterQuality - impact);
    nutrients = Math.min(1, nutrients + impact * 1.2);
    oxygen = Math.max(0, oxygen - impact * 0.6);
    foods.push({ x: this.x, y: this.y, vy: 8, eaten: false, r: 4.5, age: 0, corpse: true });
  }
  draw() {
    if (!this.alive) return;
    const s = 15 * this.size;
    const stress = this.stressLevel();
    const sick = stress > 0.35 || waterQuality < 0.3 || this.hunger < 0.15;
    const gasp = oxygen < 0.35 || stress > 0.55;
    const starving = this.hunger < 0.2;
    const w = this.wiggle;
    const bodyWave = Math.sin(w) * (0.07 + stress * 0.06);
    const tailAmp = this.fleeing ? 0.85 : 0.55;
    const tailWag = Math.sin(w * 1.8) * tailAmp;
    const tailWag2 = Math.sin(w * 1.8 + 0.6) * tailAmp * 0.7;
    const dorsalWag = Math.sin(w * 1.3) * 0.12;
    const pectoral = Math.sin(w * 2.4) * 0.45;
    const bob = Math.sin(w * 0.7) * (this.fleeing ? 1.2 : 0.6);

    ctx.save();
    ctx.translate(this.x, this.y + bob);
    const flip = Math.cos(this.dir) < 0;
    ctx.scale(flip ? -1 : 1, 1);
    ctx.rotate(bodyWave + Math.sin(this.dir) * 0.04);

    const colL = sick ? "#c0a060" : this.hue.light;
    const colD = sick ? "#a08040" : this.hue.dark;
    const bodyH = s * (0.70 + Math.sin(w * 2) * 0.03);
    // 背深腹浅的纵向渐变（背部深橙红，腹部金黄），更接近真实/参考图中的金鱼配色
    const bodyGrad = ctx.createLinearGradient(0, -bodyH * 1.1, 0, bodyH * 1.05);
    bodyGrad.addColorStop(0, colD);
    bodyGrad.addColorStop(0.42, colD);
    bodyGrad.addColorStop(0.72, colL);
    bodyGrad.addColorStop(1, colL);

    const tailBase = { x: -s * 0.85, y: 0 };
    const tailP1u = { x: -s * 1.55, y: -s * (0.9 + tailWag * 0.2) };
    const tailP2u = { x: -s * (2.7 + Math.abs(tailWag) * 0.25), y: -s * 0.2 + tailWag * s * 1.1 };
    const tailP1l = { x: -s * 1.55, y: s * (0.9 - tailWag2 * 0.2) };
    const tailP2l = { x: -s * (2.7 + Math.abs(tailWag2) * 0.25), y: s * 0.2 + tailWag2 * s * 1.1 };
    const tailGrad = ctx.createLinearGradient(tailBase.x, 0, tailP2u.x, 0);
    tailGrad.addColorStop(0, colL);
    tailGrad.addColorStop(1, colD);
    ctx.fillStyle = tailGrad;
    ctx.globalAlpha = 0.92;
    ctx.beginPath();
    ctx.moveTo(tailBase.x, tailBase.y);
    ctx.quadraticCurveTo(tailP1u.x, tailP1u.y, tailP2u.x, tailP2u.y);
    ctx.quadraticCurveTo(-s * 1.55, -s * 0.06, -s * 0.9, 0);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(tailBase.x, tailBase.y);
    ctx.quadraticCurveTo(tailP1l.x, tailP1l.y, tailP2l.x, tailP2l.y);
    ctx.quadraticCurveTo(-s * 1.55, s * 0.06, -s * 0.9, 0);
    ctx.fill();
    ctx.globalAlpha = 1;
    drawFinRays(tailBase, tailP1u, tailP2u, 9, colD, 0.42, Math.max(0.6, s * 0.028));
    drawFinRays(tailBase, tailP1l, tailP2l, 9, colD, 0.42, Math.max(0.6, s * 0.028));

    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.95, bodyH, 0, 0, Math.PI * 2); ctx.fill();
    if (stress > 0.25) {
      ctx.fillStyle = `rgba(180,90,40,${stress * 0.22})`;
      ctx.beginPath(); ctx.ellipse(0, 0, s * 0.95, bodyH, 0, 0, Math.PI * 2); ctx.fill();
    }
    // 鳞片质感：几道淡淡的弧形纹理，让身体不那么光秃
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.95, bodyH, 0, 0, Math.PI * 2); ctx.clip();
    ctx.strokeStyle = `rgba(255,255,255,0.18)`;
    ctx.lineWidth = Math.max(0.5, s * 0.02);
    for (let gx = -0.5; gx <= 0.6; gx += 0.28) {
      ctx.beginPath();
      ctx.moveTo(s * gx, -bodyH);
      ctx.quadraticCurveTo(s * (gx + 0.08), 0, s * gx, bodyH);
      ctx.stroke();
    }
    ctx.strokeStyle = `rgba(120,50,20,0.12)`;
    for (let gy = -0.6; gy <= 0.6; gy += 0.4) {
      ctx.beginPath();
      ctx.moveTo(-s * 0.9, bodyH * gy);
      ctx.quadraticCurveTo(0, bodyH * gy * 1.08, s * 0.9, bodyH * gy);
      ctx.stroke();
    }
    ctx.restore();
    if (this.armor > 0.15 && this.stage === "adult") {
      const a = this.armor;
      ctx.strokeStyle = `rgba(220,200,120,${0.35 + a * 0.5})`;
      ctx.lineWidth = 1.2 + a;
      ctx.beginPath(); ctx.ellipse(0, 0, s * 0.98, bodyH + s * 0.03, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = `rgba(255,230,150,${0.12 + a * 0.25})`;
      for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
        if (!i && !j) continue;
        ctx.beginPath(); ctx.ellipse(i * s * 0.35, j * s * 0.28, s * 0.16, s * 0.12, 0.2, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (this.hue.patch && this.stage === "adult") {
      ctx.fillStyle = this.hue.patch;
      ctx.beginPath(); ctx.ellipse(-s * 0.2, -s * 0.2, s * 0.3, s * 0.22, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(s * 0.3, s * 0.15, s * 0.22, s * 0.16, -0.4, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = colL;
    const dorsalP0 = { x: -s * 0.15, y: -bodyH * 0.85 };
    const dorsalP1 = { x: s * 0.05, y: -bodyH * (1.9 + dorsalWag) };
    const dorsalP2 = { x: s * 0.4, y: -bodyH * 0.75 };
    ctx.beginPath();
    ctx.moveTo(dorsalP0.x, dorsalP0.y);
    ctx.quadraticCurveTo(dorsalP1.x, dorsalP1.y, dorsalP2.x, dorsalP2.y);
    ctx.quadraticCurveTo(s * 0.1, -bodyH * 0.95, dorsalP0.x, dorsalP0.y);
    ctx.fill();
    drawFinRays(dorsalP0, dorsalP1, dorsalP2, 6, colD, 0.4, Math.max(0.5, s * 0.025));

    ctx.beginPath();
    ctx.moveTo(-s * 0.1, bodyH * 0.8);
    ctx.quadraticCurveTo(s * 0.05, bodyH * (1.25 - dorsalWag * 0.5), s * 0.3, bodyH * 0.7);
    ctx.quadraticCurveTo(s * 0.05, bodyH * 0.9, -s * 0.1, bodyH * 0.8);
    ctx.fill();

    for (const side of [-1, 1]) {
      const ang = side * (0.85 + pectoral * 0.5);
      ctx.save();
      ctx.translate(s * 0.1, side * bodyH * 0.35);
      ctx.rotate(ang);
      ctx.fillStyle = colL;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.ellipse(s * 0.2, 0, s * 0.38, s * 0.14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = colD;
      ctx.globalAlpha = 0.35;
      ctx.lineWidth = Math.max(0.5, s * 0.02);
      for (let r = -1; r <= 1; r++) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(s * 0.5, r * s * 0.1);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    for (const side of [-1, 1]) {
      const ex = s * (this.stage === "baby" ? 0.5 : 0.58);
      const ey = side * s * (this.stage === "baby" ? 0.28 : 0.34);
      const er = this.stage === "baby" ? s * 0.18 : s * 0.30;
      ctx.fillStyle = sick ? "#f0e8d0" : "#fff8ec";
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fill();
      const pr = er * (this.fleeing ? 0.62 : (starving ? 0.35 : 0.52));
      ctx.fillStyle = "#191410";
      ctx.beginPath(); ctx.arc(ex + er * 0.25, ey, pr, 0, Math.PI * 2); ctx.fill();
      if (!sick) {
        ctx.fillStyle = "rgba(255,255,255,.8)";
        ctx.beginPath(); ctx.arc(ex + er * 0.05, ey - er * 0.25, er * 0.16, 0, Math.PI * 2); ctx.fill();
      }
    }

    if (this.fleeing || gasp) {
      const mo = 1.2 + Math.sin(w * 4) * 0.8;
      ctx.fillStyle = "rgba(40,20,20,.55)";
      ctx.beginPath(); ctx.ellipse(s * 0.92, 0, mo, mo * 0.55, 0, 0, Math.PI * 2); ctx.fill();
    }

    if (gasp) {
      for (let i = 0; i < 1 + (stress > 0.7 ? 1 : 0); i++) {
        const bx = s * 0.95 + Math.sin(t * 5 + i * 2) * 3;
        const by = -s * 0.15 - ((t * 28 + i * 12) % 22);
        ctx.strokeStyle = `rgba(200,230,255,${0.45 + stress * 0.4})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(bx, by, 1.2 + i * 0.6, 0, Math.PI * 2); ctx.stroke();
      }
    }
    ctx.restore();

    if (stress > 0.4) {
      const ix = this.x, iy = this.y - s * 1.35 - 4;
      const pulse = 0.65 + Math.sin(t * 6 + this.x) * 0.35;
      ctx.save();
      ctx.globalAlpha = 0.55 + stress * 0.45;
      ctx.font = `bold ${Math.max(9, s * 0.55)}px sans-serif`;
      ctx.textAlign = "center";
      if (starving) { ctx.fillStyle = `rgba(220,80,40,${pulse})`; ctx.fillText("饿", ix, iy); }
      else if (oxygen < 0.3) { ctx.fillStyle = `rgba(80,160,220,${pulse})`; ctx.fillText("氧", ix, iy); }
      else if (waterQuality < 0.3) { ctx.fillStyle = `rgba(180,140,40,${pulse})`; ctx.fillText("水", ix, iy); }
      else if (this.fleeing || this.hideTime > 8) {
        ctx.fillStyle = `rgba(255,200,60,${pulse})`;
        ctx.font = `bold ${Math.max(11, s * 0.65)}px sans-serif`;
        ctx.fillText("!", ix, iy);
      } else {
        ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(ix - 7, iy - 2, 14, 3);
        ctx.fillStyle = stress > 0.7 ? "#e05030" : "#e0a020";
        ctx.fillRect(ix - 7, iy - 2, 14 * stress, 3);
      }
      ctx.restore();
    }
  }
}

/* —— turtle —— */
function hexPath(cx, cy, rw, rh, rot) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const ang = (rot || 0) + i * Math.PI / 3;
    const px = cx + Math.cos(ang) * rw;
    const py = cy + Math.sin(ang) * rh;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}
function drawScute(cx, cy, rw, rh, rot, alt) {
  hexPath(cx, cy, rw, rh, rot);
  ctx.fillStyle = alt ? "rgba(215,225,120,0.28)" : "rgba(30,55,20,0.22)";
  ctx.fill();
  ctx.strokeStyle = "rgba(210,190,90,0.65)";
  ctx.lineWidth = 1.1;
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,220,0.28)";
  ctx.lineWidth = 0.7;
  hexPath(cx, cy, rw * 0.62, rh * 0.62, rot);
  ctx.stroke();
  hexPath(cx, cy, rw * 0.32, rh * 0.32, rot);
  ctx.stroke();
}

class Turtle {
  constructor() {
    this.x = W * 0.3; this.y = floorY() - 20;
    this.dir = 0; this.speed = 24; this.legPhase = 0;
    this.state = "swim"; this.stateTimer = rand(6, 12);
    this.tx = this.x; this.ty = this.y;
    this.chasingFood = false; this.eatTimer = 0;
    this.belly = 0; this.digestTimer = 0; this.meals = 0;
    this.baskNeed = rand(18, 28); this.peaceful = false;
    this.pickTarget();
  }
  pickTarget() {
    this.tx = rand(34, W - 34);
    this.ty = rand(floorY() - 50, floorY() - 10);
  }
  findPrey() {
    let best = null, bestD = Infinity, kind = null;
    for (const f of foods) {
      if (f.eaten) continue;
      const d = Math.hypot(f.x - this.x, f.y - this.y) + (f.corpse ? -8 : 0);
      if (d < bestD) { bestD = d; best = f; kind = "food"; }
    }
    for (const e of eggs) {
      if (!e.alive) continue;
      const cover = plantCoverAt(e.x, e.y);
      if (cover > 0.55) continue;
      const d = Math.hypot(e.x - this.x, e.y - this.y) + cover * 50;
      if (d < bestD) { bestD = d; best = e; kind = "egg"; }
    }
    for (const f of fishes) {
      if (!f.alive || f.stage !== "baby") continue;
      const cover = plantCoverAt(f.x, f.y);
      if (cover > 0.5 || f.hiding) continue;
      let shielded = false;
      for (const a of fishes) {
        if (a.alive && a.stage === "adult" && a.armor >= 0.4 && Math.hypot(a.x - f.x, a.y - f.y) < 55) {
          shielded = true; break;
        }
      }
      if (shielded) continue;
      const d = Math.hypot(f.x - this.x, f.y - this.y) + cover * 60;
      if (d < bestD) { bestD = d; best = f; kind = "baby"; }
    }
    return best ? { target: best, dist: bestD, kind } : null;
  }
  eat(target, kind) {
    if (kind === "food") target.eaten = true;
    else if (kind === "egg") target.alive = false;
    else if (kind === "baby") target.die();
    this.eatTimer = 0.55;
    this.meals++;
    this.belly = Math.min(1, this.belly + (kind === "baby" ? 0.4 : kind === "egg" ? 0.15 : 0.28));
    this.digestTimer = Math.max(this.digestTimer, 8 + this.meals * 3);
    waterQuality = Math.max(0, waterQuality - 0.008);
    nutrients = Math.min(1, nutrients + 0.015);
    playBlip(220);
  }
  update(dt) {
    this.stateTimer -= dt;
    if (this.eatTimer > 0) this.eatTimer -= dt;
    if (this.digestTimer > 0) {
      this.digestTimer -= dt;
      if (this.digestTimer <= 0) {
        this.belly = Math.max(0, this.belly - 0.2);
        this.meals = Math.max(0, this.meals - 1);
        if (this.belly > 0.05) this.digestTimer = 5;
        else { this.belly = 0; this.meals = 0; }
      }
    }
    const isFull = this.belly > 0.7;
    this.baskNeed -= dt;
    this.peaceful = isFull || this.state === "surfaced" || this.state === "toSurface";

    if (this.baskNeed <= 0 && this.state === "swim") {
      this.state = "toSurface"; this.stateTimer = 25; this.chasingFood = false;
    }
    const found = (!this.peaceful && this.baskNeed > 0) ? this.findPrey() : null;
    this.chasingFood = false;
    if (found && this.state !== "surfaced" && this.eatTimer <= 0) {
      if (this.state === "diving") { this.state = "swim"; this.stateTimer = rand(3, 6); }
      this.chasingFood = true;
      this.tx = found.target.x; this.ty = found.target.y;
      if (found.dist < (found.kind === "baby" ? 22 : 26)) {
        this.eat(found.target, found.kind);
        this.chasingFood = false;
      }
    }
    if (!this.chasingFood && this.state === "swim") {
      if (Math.hypot(this.tx - this.x, this.ty - this.y) < 12 || this.stateTimer <= 0) {
        if (this.baskNeed <= 5 || isFull) { this.state = "toSurface"; this.stateTimer = 20; }
        else { this.pickTarget(); this.stateTimer = rand(4, 9); }
      }
    } else if (this.state === "toSurface") {
      this.tx = W * 0.84; this.ty = surfaceY() - 6;
      if (Math.hypot(this.tx - this.x, this.ty - this.y) < 10) {
        this.state = "surfaced";
        this.stateTimer = isFull ? rand(8, 14) : rand(5, 9);
      }
    } else if (this.state === "surfaced") {
      this.tx = this.x; this.ty = this.y;
      if (this.belly > 0) this.digestTimer = Math.max(0, this.digestTimer - dt * 0.5);
      if (this.stateTimer <= 0) {
        this.state = "diving"; this.baskNeed = rand(20, 32);
        this.pickTarget(); this.stateTimer = 8;
      }
    } else if (this.state === "diving") {
      if (Math.hypot(this.tx - this.x, this.ty - this.y) < 12) {
        this.state = "swim"; this.stateTimer = rand(4, 9);
      }
    }
    if (this.state !== "surfaced") {
      const dx = this.tx - this.x, dy = this.ty - this.y;
      const dist = Math.hypot(dx, dy) || 1;
      let diff = Math.atan2(dy, dx) - this.dir;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      this.dir += diff * Math.min(1, dt * (this.chasingFood ? 3.4 : isFull ? 1.1 : 1.6));
      let mul = 1;
      if (this.chasingFood) mul = 2.6;
      else if (this.eatTimer > 0) mul = 0.35;
      else if (isFull) mul = 0.55;
      const step = Math.min(this.speed * mul * dt, dist);
      this.x = clamp(this.x + Math.cos(this.dir) * step, 26, W - 26);
      this.y = clamp(this.y + Math.sin(this.dir) * step, surfaceY() + 10, floorY() - 8);
      this.legPhase += dt * (this.chasingFood ? 11 : isFull ? 3 : 5);
    } else this.legPhase += dt;
  }
  draw() {
    const s = 24 * (1 + this.belly * 0.12);
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(Math.cos(this.dir) < 0 ? -1 : 1, 1);
    ctx.fillStyle = "#3a6b32";
    for (let i = 0; i < 4; i++) {
      const side = i < 2 ? -1 : 1, front = i % 2 === 0;
      const phase = this.legPhase + (front ? 0 : Math.PI) + (side < 0 ? 0 : Math.PI);
      const lx = (front ? s * 0.55 : -s * 0.5) + Math.sin(phase) * 3;
      const ly = side * s * 0.52 + Math.cos(phase) * 3.5;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.rotate(side * 0.45);
      ctx.fillStyle = "#3a6b32";
      ctx.beginPath(); ctx.ellipse(0, 0, 10, 4.2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(215,225,130,0.6)";
      ctx.lineWidth = 0.8;
      for (let k = -1; k <= 1; k++) {
        ctx.beginPath(); ctx.moveTo(-8, k * 1.7); ctx.lineTo(7.5, k * 1.7); ctx.stroke();
      }
      ctx.fillStyle = "#ddd9b6";
      for (let c = -1; c <= 1; c++) {
        ctx.beginPath();
        ctx.moveTo(9, c * 1.5); ctx.lineTo(12.5, c * 2.3); ctx.lineTo(9.6, c * 1.7 + 0.5);
        ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    const g = ctx.createRadialGradient(-s * 0.15, -s * 0.25, 2, 0, 0, s * 1.05);
    g.addColorStop(0, "#7aa347"); g.addColorStop(0.45, "#4f7536"); g.addColorStop(1, "#2a4420");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.68, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * 0.68, 0, 0, Math.PI * 2); ctx.clip();
    // 背甲盾片(scute)纹理：中线椎盾5块 + 两侧肋盾4x2块，每块带年轮质感
    const vX = [-0.62, -0.34, -0.05, 0.24, 0.5];
    vX.forEach((fx, i) => drawScute(s * fx, 0, s * 0.19, s * 0.17, 0, i % 2 === 0));
    const cX = [-0.5, -0.2, 0.08, 0.35];
    for (const side of [-1, 1]) {
      cX.forEach((fx, i) => drawScute(s * fx, side * s * 0.33, s * 0.17, s * 0.16, side * 0.12, i % 2 === 1));
    }
    ctx.restore();
    ctx.strokeStyle = "rgba(200,180,90,0.5)"; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.ellipse(0, 0, s * 0.92, s * 0.60, 0, 0, Math.PI * 2); ctx.stroke();
    // 边缘盾片刻纹
    ctx.strokeStyle = "rgba(20,30,10,0.4)"; ctx.lineWidth = 1;
    for (let a = 0; a < 16; a++) {
      const ang = (a / 16) * Math.PI * 2;
      const ex = Math.cos(ang) * s * 0.98, ey = Math.sin(ang) * s * 0.66;
      const ex2 = Math.cos(ang) * s * 0.86, ey2 = Math.sin(ang) * s * 0.58;
      ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(ex2, ey2); ctx.stroke();
    }
    ctx.fillStyle = "#4a7a38";
    ctx.beginPath(); ctx.ellipse(s * 0.85, -1, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#3f6e32";
    ctx.beginPath(); ctx.ellipse(s * 1.12, -2, 9, 6.5, 0, 0, Math.PI * 2); ctx.fill();
    // 颈部/头部条纹(红耳龟标志性黄绿细纹)
    ctx.strokeStyle = "rgba(212,226,120,0.75)"; ctx.lineWidth = 1;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(s * 0.76, k * 3.2);
      ctx.quadraticCurveTo(s * 0.98, k * 3.6, s * 1.2, k * 2.1);
      ctx.stroke();
    }
    ctx.strokeStyle = "rgba(230,200,70,0.85)"; ctx.lineWidth = 1.3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(s * 0.95, -6); ctx.lineTo(s * 1.28, -5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s * 0.95, 2); ctx.lineTo(s * 1.25, 3); ctx.stroke();
    ctx.fillStyle = "#d4452f";
    ctx.beginPath(); ctx.ellipse(s * 1.05, -7.5, 4.2, 2.4, 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1a1e12";
    ctx.beginPath(); ctx.arc(s * 1.2, -3, 1.5, 0, Math.PI * 2); ctx.fill();
    // 下颌/喉部浅黄色斑块，呼应参考图中红耳龟偏亮的喉部颜色
    ctx.fillStyle = "rgba(220,225,150,0.55)";
    ctx.beginPath(); ctx.ellipse(s * 1.08, 4.5, 6, 3.6, 0.15, 0, Math.PI * 2); ctx.fill();
    const jaw = this.eatTimer > 0 ? 3.2 * Math.sin((0.55 - this.eatTimer) * 14) : 0;
    ctx.fillStyle = "#2a4020";
    ctx.beginPath();
    ctx.moveTo(s * 1.26, -1.2); ctx.lineTo(s * 1.40, -0.2); ctx.lineTo(s * 1.26, 1.6 + jaw);
    ctx.closePath(); ctx.fill();
    if (this.belly > 0.2) {
      ctx.fillStyle = `rgba(40,60,25,${0.25 + this.belly * 0.35})`;
      ctx.beginPath();
      ctx.ellipse(0, s * 0.35, s * 0.55 * this.belly, s * 0.18 * this.belly, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* —— audio —— */
let audioCtx = null;
function playBlip(freq = 480) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t0);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.6, t0 + 0.12);
    gain.gain.setValueAtTime(0.001, t0);
    gain.gain.exponentialRampToValueAtTime(0.12, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.15);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + 0.16);
  } catch (_) {}
}

}

  waterQuality = Math.min(1, waterQuality + 0.45);
  nutrients = Math.max(0, nutrients - 0.15);

function addAdultGoldfish() {
  if (fishes.filter(f => f.alive).length >= MAX_FISH) { playBlip(180); return; }
  const hue = { ...PALETTES[Math.floor(Math.random() * PALETTES.length)] };
  if (!hue.patch && Math.random() < 0.5) hue.patch = "rgba(255,255,255,.5)";
  const g = new Goldfish(hue, "adult");
  g.size = rand(1.05, 1.25);
  g.hunger = 0.55;
  g.x = rand(W * 0.25, W * 0.75);
  g.y = rand(surfaceY() + 30, floorY() - 30);
  fishes.push(g);
  playBlip(640);
}

/* —— 鱼缸动态尺寸：始终按最大可用空间的95%显示（无侧栏占用） —— */
(function () {
  const app = document.getElementById("app");
  const stage = document.getElementById("stage");

  let fitQueued = false;
  function fitStage() {
    fitQueued = false;
    const bs = getComputedStyle(document.body);
    const padH = (parseFloat(bs.paddingTop) || 0) + (parseFloat(bs.paddingBottom) || 0);
    const padW = (parseFloat(bs.paddingLeft) || 0) + (parseFloat(bs.paddingRight) || 0);
    const viewport = window.visualViewport;
    const vw = viewport ? viewport.width : window.innerWidth;
    const vh = viewport ? viewport.height : window.innerHeight;
    const availH = vh - padH;
    const availW = vw - padW;
    let w = Math.max(0, availW) * 0.95;
    let h = Math.max(0, availH) * 0.95;
    if (w < 60 || h < 60) return;
    stage.style.width = Math.floor(w) + "px";
    stage.style.height = Math.floor(h) + "px";
    scheduleResize();
  }

  function queueFit(){
    if (fitQueued) return;
    fitQueued = true;
    requestAnimationFrame(fitStage);
  }
  fitStage();
  window.addEventListener("resize", queueFit);
  window.addEventListener("orientationchange", () => setTimeout(queueFit, 80));
  if (window.visualViewport) window.visualViewport.addEventListener("resize", queueFit);
})();

/* —— 悬浮统一菜单：长按唤出 / 仅右上角✕关闭 —— */
const menuOverlay = document.getElementById("menuOverlay");
function openMenu() { menuOverlay.classList.add("show"); }
function closeMenu() { menuOverlay.classList.remove("show"); }
document.getElementById("btnCloseMenu").addEventListener("click", closeMenu);

/* —— 手势反馈提示 —— */
const gestureToast = document.getElementById("gestureToast");
let gestureToastT = 0;
function flashGestureToast(text) {
  gestureToast.textContent = text;
  gestureToast.classList.add("show");
  clearTimeout(gestureToastT);
  gestureToastT = setTimeout(() => gestureToast.classList.remove("show"), 1100);
}

let tankFrozen = false;

/* —— 鱼缸手势识别：长按=菜单 / 点击=投食(多点多投) / 画圈=换水 / 画✅=开关过滤 / ←→划=修剪 / ↑划=昼夜 / ↓划=加鱼 —— */
(function () {
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const TAP_MOVE_LIMIT = 14;     // 移动小于此值视为"点击"而非"划线"
  const LONG_PRESS_MS = 550;     // 长按唤出菜单所需时长
  const MIN_SWIPE = 55;          // 直线划动的最小位移

  let tracking = false;
  let points = [];
  let downPt = null;
  let longPressTimer = null;
  let longPressFired = false;

  function localPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function classifyGesture(pts) {
    const n = pts.length;
    if (n < 8) return null;
    let cx = 0, cy = 0;
    for (const p of pts) { cx += p.x; cy += p.y; }
    cx /= n; cy /= n;
    let minR = Infinity, maxR = 0;
    for (const p of pts) {
      const r = Math.hypot(p.x - cx, p.y - cy);
      if (r < minR) minR = r;
      if (r > maxR) maxR = r;
    }
    let totalAngle = 0;
    for (let i = 1; i < n; i++) {
      const a1 = Math.atan2(pts[i - 1].y - cy, pts[i - 1].x - cx);
      const a2 = Math.atan2(pts[i].y - cy, pts[i].x - cx);
      let d = a2 - a1;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      totalAngle += d;
    }
    const closeLoop = dist(pts[0], pts[n - 1]) < Math.max(45, maxR * 0.7);
    const roundness = maxR > 0 ? minR / maxR : 0;
    if (Math.abs(totalAngle) > Math.PI * 1.25 && closeLoop && roundness > 0.3 && maxR > 16) {
      return "circle";
    }
    let vi = 0;
    for (let i = 1; i < n; i++) if (pts[i].y > pts[vi].y) vi = i;
    const start = pts[0], vertex = pts[vi], end = pts[n - 1];
    const seg1dy = vertex.y - start.y;
    const seg2dx = end.x - vertex.x, seg2dy = end.y - vertex.y;
    const seg1len = Math.hypot(vertex.x - start.x, seg1dy);
    const seg2len = Math.hypot(seg2dx, seg2dy);
    const vertexMid = vi > n * 0.06 && vi < n * 0.8;
    if (vertexMid && seg1dy > 4 && seg2dy < -4 && seg2len > seg1len * 0.85) {
      return "check";
    }
    // 直线划动：左右修剪 / 上下昼夜 / 上下加鱼
    let pathLen = 0;
    for (let i = 1; i < n; i++) pathLen += dist(pts[i - 1], pts[i]);
    const dx = end.x - start.x, dy = end.y - start.y;
    const netDist = Math.hypot(dx, dy);
    const straightness = pathLen > 0 ? netDist / pathLen : 0;
    if (straightness > 0.75 && netDist > MIN_SWIPE) {
      if (Math.abs(dx) > Math.abs(dy) * 1.5) return dx > 0 ? "swipe-right" : "swipe-left";
      if (Math.abs(dy) > Math.abs(dx) * 1.5) return dy < 0 ? "swipe-up" : "swipe-down";
    }
    return null;
  }

  function onDown(e) {
    if (menuOverlay.classList.contains("show")) return;
    tankFrozen = false;
    tracking = true;
    longPressFired = false;
    downPt = localPos(e);
    points = [downPt];
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      longPressFired = true;
      openMenu();
    }, LONG_PRESS_MS);
  }
  function onMove(e) {
    if (!tracking || longPressFired) return;
    const p = localPos(e);
    const last = points[points.length - 1];
    if (dist(last, p) > 3) points.push(p);
    if (dist(downPt, p) > TAP_MOVE_LIMIT) {
      clearTimeout(longPressTimer);
      e.preventDefault();
    }
  }
  function onUp(e) {
    if (!tracking) return;
    tracking = false;
    clearTimeout(longPressTimer);
    if (longPressFired) { points = []; return; }
    const upPt = localPos(e);
    let maxSpread = 0;
    for (const p of points) maxSpread = Math.max(maxSpread, dist(downPt, p));
    if (maxSpread < TAP_MOVE_LIMIT) {
      // 点击：每点一下投一粒食物，多点多投
      dropFood(upPt.x, surfaceY() + 6);
      playBlip(560);
      points = [];
      return;
    }
    const g = classifyGesture(points);
    if (g === "circle") {
      changeWater();
      flashGestureToast("🔄 已自动换水");
    } else if (g === "check") {
      toggleFilter();
      flashGestureToast(filterOn ? "✅ 已开启过滤" : "⏸ 已关闭过滤");
    } else if (g === "swipe-right") {
      trimPlants();
      flashGestureToast("🌿 已修剪水草");
    } else if (g === "swipe-left") {
      tankFrozen = true;
      flashGestureToast("⏸ 画面已定格");
    } else if (g === "swipe-up") {
      isNight = !isNight; staticDirty = true; playBlip(isNight ? 300 : 700);
      flashGestureToast(isNight ? "🌙 夜晚模式" : "☀️ 白天模式");
    } else if (g === "swipe-down") {
      addAdultGoldfish();
      flashGestureToast("🐟 已添加金鱼");
    }
    points = [];
  }
  function onCancel() {
    tracking = false;
    longPressFired = false;
    clearTimeout(longPressTimer);
    points = [];
  }

  canvas.addEventListener("pointerdown", onDown);
  canvas.addEventListener("pointermove", onMove, { passive: false });
  canvas.addEventListener("pointerup", onUp);
  canvas.addEventListener("pointercancel", onCancel);
})();

const wqBar = document.getElementById("wqBar");
const oxBar = document.getElementById("oxBar");
const popStatHud = document.getElementById("popStatHud");
const wqMonitorEl = document.getElementById("wqMonitor");
const tempRead=document.getElementById("tempRead"), phRead=document.getElementById("phRead"), nutRead=document.getElementById("nutRead"), oxRead=document.getElementById("oxRead");

function updateHUD() {
  const pct = Math.round(waterQuality * 100);
  wqBar.style.width = pct + "%";
  wqBar.style.background = waterQuality > 0.55 ? "#3dcc7a" : waterQuality > 0.3 ? "#d4a017" : "#d4452f";
  const ox = Math.round(oxygen * 100);
  tempRead.textContent = (isNight ? 22.6 : 24.0).toFixed(1) + "°C";
  phRead.textContent = (6.8 + waterQuality * .6).toFixed(1);
  nutRead.textContent = Math.round(nutrients*100) + "%";
  oxRead.textContent = ox + "%";
  oxBar.style.width = ox + "%";
  oxBar.style.background = oxygen > 0.55 ? "#5ec8ff" : oxygen > 0.3 ? "#d4a017" : "#d4452f";
  const alive = fishes.filter(f => f.alive).length;
  const babies = fishes.filter(f => f.alive && f.stage === "baby").length;
  const hideN = fishes.filter(f => f.alive && f.hiding).length;
  const armorN = fishes.filter(f => f.alive && f.armor >= 0.4).length;
  const stressN = fishes.filter(f => f.alive && f.stressLevel() > 0.4).length;
  let extra = "";
  if (babies) extra += ` · 幼${babies}`;
  if (eggs.length) extra += ` · 卵${eggs.length}`;
  if (hideN) extra += ` · 藏${hideN}`;
  if (armorN) extra += ` · 甲${armorN}`;
  if (stressN) extra += ` · 压${stressN}`;
  if (turtle.peaceful) extra += ` · 和平`;
  popStatHud.textContent = `🐟 ${alive}` + extra;
  const g = wqGrade(waterQuality);
  wqMonitorEl.className = g.cls;
  wqMonitorEl.innerHTML =
    `水质监测 · <b>${g.label}</b> ${pct}%${wqTrend()} · O₂${ox}% · 肥${Math.round(nutrients * 100)}%` +
    (filterOn ? " · 过滤开" : "") +
    `<span style="opacity:.85"> · ${wqAdvice()}</span>`;
  if (wqAlertTimer <= 0) document.getElementById("wqAlert").classList.remove("show");
}

function updateEco(dt) {
  const n = fishes.filter(f => f.alive).length;
  if (filterOn) {
    waterQuality = Math.min(1, waterQuality + 0.028 * dt);
    nutrients = Math.max(0, nutrients - 0.012 * dt);
    oxygen = Math.min(1, oxygen + 0.018 * dt);
  } else waterQuality = clamp(waterQuality + 0.002 * dt, 0, 1);
  oxygen = clamp(oxygen + (isNight ? -0.006 : 0.01) * dt, 0, 1);
  if (n > 4) {
    waterQuality = Math.max(0, waterQuality - 0.003 * (n - 4) * dt);
    oxygen = Math.max(0, oxygen - 0.005 * (n - 4) * dt);
  }
  if (isNight && n > 5) waterQuality = Math.max(0, waterQuality - 0.003 * (n - 5) * dt);
  oxygen = Math.max(0, oxygen - 0.01 * dt);
  wqSampleAcc += dt;
  if (wqSampleAcc >= 0.45) { wqSampleAcc = 0; pushWqSample(); }
  if (wqAlertTimer > 0) wqAlertTimer -= dt;
  fishes = fishes.filter(f => f.alive);
}

let last = performance.now();
const actors = [];
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!tankFrozen) {
    t += dt;
    updateBubbles(dt); updateFood(dt); updateEggs(dt);
    updatePlants(dt); updateEco(dt);
    turtle.update(dt);
    for (let i = 0; i < fishes.length; i++) fishes[i].update(dt);
  }
  if (staticDirty) rebuildStaticLayer();
  ctx.clearRect(0, 0, W, H);
  drawWater();
  ctx.drawImage(staticCanvas, 0, 0, W, H);
  drawPlants(); drawEggs(); drawBubbles(); drawFood();
  actors.length = 0;
  actors.push(turtle);
  for (let i = 0; i < fishes.length; i++) actors.push(fishes[i]);
  actors.sort((a, b) => a.y - b.y);
  for (let i = 0; i < actors.length; i++) actors[i].draw();
  updateHUD();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
